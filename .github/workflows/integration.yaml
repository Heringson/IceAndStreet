name: integration ci sonar
run-name: Pipeline de integração contínua e analise de código

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Desabilitar shallow clone melhora a relevância da análise do Sonar

      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=IceAndStreet
            -Dsonar.projectName=IceAndStreet
            -Dsonar.projectVersion=1.0
            -Dsonar.sources=.