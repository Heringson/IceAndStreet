name: Deploy
run-name: Deploy do site
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
    deploy:
        name: deploy
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4.2.2
              with:
                fetch-depth: 0
            
            # Atualizado para a v4 para evitar avisos de depreciação do Node 20
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20'
            
            # Se você usa cache do npm, pode adicionar aqui para acelerar o build se necessário
            
            - name: Docker login
              uses: docker/login-action@v3.4.0
              with:
                username: ${{ secrets.DOCKER_USER }}
                password: ${{ secrets.DOCKER_PASSWORD }}
            
            - name: Docker Build and Push
              uses: docker/build-push-action@v6.16.0
              with:
                context: .
                file: ./Dockerfile
                push: true
                tags: heringsonlima/iceandstreet:latest
            
            - name: Azure Deploy
              uses: Azure/webapps-deploy@v3.0.1
              with: 
                app-name: iceandstreet
                publish-profile: ${{ secrets.PUBLISH_PROFILE }}
                images: heringsonlima/iceandstreet:latest
    
    integration-test:
        name: test-e2e
        runs-on: ubuntu-latest
        needs: deploy

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4.2.2
              with:
                fetch-depth: 0
            
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20'
            
            # Usando a Action oficial do Cypress apontando para a pasta correta
            - name: Run Cypress E2E Test
              uses: cypress-io/github-action@v7
              with:
                # Indica à Action que o package.json e as configs do Cypress estão nesta subpasta
                working-directory: integration-test